<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-5xl items-center px-6 py-12">
        <section class="w-full rounded-3xl border border-pink-400/20 bg-slate-900/80 p-8 shadow-2xl shadow-pink-950/30">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.35em] text-pink-300">Strawberry Panic PS2</p>
            <h1 class="text-4xl font-black tracking-tight text-white md:text-6xl">{{ title }}</h1>
            <p class="mt-5 max-w-2xl text-lg text-slate-300">{{ status }}</p>
            <div class="mt-8 grid gap-4 md:grid-cols-3">
                <div class="rounded-2xl border border-slate-700 bg-slate-800/70 p-5">
                    <h2 class="font-bold text-pink-200">Core</h2>
                    <p class="mt-2 text-sm text-slate-400">Glyph maps and fit checker are moving to Rust.</p>
                </div>
                <div class="rounded-2xl border border-slate-700 bg-slate-800/70 p-5">
                    <h2 class="font-bold text-pink-200">Web</h2>
                    <p class="mt-2 text-sm text-slate-400">Axum and Askama will replace FastAPI and Jinja.</p>
                </div>
                <div class="rounded-2xl border border-slate-700 bg-slate-800/70 p-5">
                    <h2 class="font-bold text-pink-200">Build</h2>
                    <p class="mt-2 text-sm text-slate-400">The final flow will stay fully driven from the browser.</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
